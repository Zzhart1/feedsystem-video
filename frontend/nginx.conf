server {
  listen 80;
  server_name _;

  # 大文件上传（分片直传）
  client_max_body_size 300m;

  root /usr/share/nginx/html;
  index index.html;

  # index.html 禁止缓存：Vite 每次构建生成带 hash 的 JS/CSS，
  # 若浏览器缓存旧 index.html 会引用已不存在的旧 hash 文件 → 白屏
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA 路由（Vue Router history 模式）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 反向代理到宿主机后端（去掉 /api 前缀）
  # host.docker.internal = Docker Desktop 访问宿主机的专用地址
  location /api/ {
    proxy_pass http://host.docker.internal:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE 长连接支持
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # 视频/封面静态文件
  location /static/ {
    proxy_pass http://host.docker.internal:8080/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
